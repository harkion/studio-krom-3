name: Client checks

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  typecheck:
    name: Client TypeScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nightlife.client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: nightlife.client/package-lock.json
      - run: npm ci
      - run: npm run typecheck
