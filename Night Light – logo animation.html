<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Night Light – logo animation</title>
<style>
:root{color-scheme:dark;--bg:#000;--fg:#ece6d6;--mut:#76736b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;overflow-x:hidden}
header{padding:28px 24px 0;text-align:center}
h1{font-weight:300;letter-spacing:.3em;text-transform:uppercase;font-size:14px;margin:0;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px;padding:24px;max-width:1000px;margin:0 auto}
.card{padding:150px 16px 28px;display:flex;flex-direction:column;align-items:center;gap:22px;border:1px solid #141414;border-radius:20px}
.logo{display:flex;align-items:center;gap:18px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.logo svg{width:150px;height:auto;overflow:visible;display:block}
.name{font-size:40px;font-weight:200;letter-spacing:.12em;line-height:1.05;color:#76736b}
.name b{display:block;font-weight:200}
.cap{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);text-align:center;line-height:1.7}
.bar{text-align:center;padding:0 0 40px}
button{background:none;color:var(--fg);border:1px solid #3a3730;border-radius:999px;padding:10px 22px;font:inherit;font-size:13px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
button:hover{border-color:#ffe2a8;color:#ffe2a8}
</style>
</head>
<body>
<header><h1>Night Light · logo</h1></header>
<div class="grid">
  <div class="card"><div class="logo" id="a"></div><div class="cap">Version 1 · mark<br>hover the bulb</div></div>
  <div class="card"><div class="logo" id="b"></div><div class="cap">Version 2 · with name<br>hover works here too</div></div>
  <div class="card"><div class="logo" id="c"></div><div class="cap">Version 3 · rises from below<br>the original idea</div></div>
  <div class="card"><div class="logo" id="d"></div><div class="cap">Version 4 · full moon rises<br>then becomes a crescent</div></div>
  <div class="card"><div class="logo" id="e"></div><div class="cap">Version 5 · silver moon<br>drops from the top</div></div>
  <div class="card"><div class="logo" id="f"></div><div class="cap">Version 6 · silver moon<br>rises from below</div></div>
</div>
<div class="bar"><button id="replay">Replay intro</button></div>

<script>
let uid = 0;
const lerp = (a, b, t) => a + (b - a) * t;
const E = {
  io: t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2,
  out: t => 1 - Math.pow(1 - t, 3),
  fall: t => -(Math.cos(Math.PI * t) - 1) / 2,
  bounce: t => { const n = 7.5625, d = 2.75;
    if (t < 1/d) return n*t*t;
    if (t < 2/d) return n*(t -= 1.5/d)*t + .75;
    if (t < 2.5/d) return n*(t -= 2.25/d)*t + .9375;
    return n*(t -= 2.625/d)*t + .984375; }
};
const GREY = [74, 74, 74], WARM = [255, 226, 168], TXT = [118, 115, 107];
const mix = (a, b, t) => `rgb(${a.map((v, i) => Math.round(lerp(v, b[i], t))).join(',')})`;

const GLASS = 'M72 106 C72 130 36 148 36 190 A64 64 0 0 0 164 190 C164 148 128 130 128 106 Z';
const CRATERS = [[-14,-10,20],[18,6,17],[-4,25,12],[-26,14,9],[8,-26,9],[28,-12,7],[-30,-4,6],[2,2,5],[16,28,5],[-12,34,4],[24,22,4]];

function makeLogo(root, withName, rise, o = {}) {
  const P = o.silver
    ? { m0: '#f4f6fa', m1: '#c3c9d3', m2: '#8d95a3', glow: '#dfe8ff', tint: '#cfdcff', light: '#f2f6ff', warm: [214, 226, 255], rim: '190,210,255' }
    : { m0: '#f6e3b4', m1: '#d9ac66', m2: '#a97a3a', glow: '#ffd9a0', tint: '#ffcf8a', light: '#fff4da', warm: [255, 226, 168], rim: '255,170,110' };
  const id = 'l' + (++uid);
  root.innerHTML = `
  <svg viewBox="0 20 200 250" aria-label="Night Light logo">
    <defs>
      <radialGradient id="${id}g" cx="50%" cy="50%" r="50%">
        <stop offset="0" stop-color="${P.glow}"/><stop offset="1" stop-color="${P.glow}" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="${id}m" cx="38%" cy="35%" r="75%">
        <stop offset="0" stop-color="${P.m0}"/><stop offset=".6" stop-color="${P.m1}"/><stop offset="1" stop-color="${P.m2}"/>
      </radialGradient>
      <filter id="${id}f" filterUnits="userSpaceOnUse" x="-60" y="-60" width="120" height="120">
        <feGaussianBlur in="SourceGraphic" stdDeviation="1.3" result="b"/>
        <feTurbulence type="fractalNoise" baseFrequency=".05" numOctaves="5" seed="11" result="n"/>
        <feDiffuseLighting in="n" surfaceScale="3" diffuseConstant="1.05" lighting-color="${P.light}" result="l"><feDistantLight azimuth="235" elevation="58"/></feDiffuseLighting>
        <feComposite in="l" in2="b" operator="arithmetic" k1="1.35" k2="0" k3="0" k4="0" result="t"/>
        <feComposite in="t" in2="b" operator="in"/>
      </filter>
      <clipPath id="${id}c"><path d="${GLASS}"/></clipPath>
      <mask id="${id}k" maskUnits="userSpaceOnUse" x="-80" y="-80" width="160" height="160">
        <rect x="-80" y="-80" width="160" height="160" fill="#fff"/>
        <circle r="49.6" cx="13.5" cy="-11.3" fill="#000"/>
      </mask>
    </defs>
    <circle id="${id}glow" cx="100" cy="190" r="150" fill="url(#${id}g)" opacity="0"/>
    <path id="${id}fill" d="${GLASS}" fill="${P.tint}" opacity="0"/>
    <g clip-path="url(#${id}c)">
      <g id="${id}moon"><g id="${id}full" filter="url(#${id}f)"><circle r="52" fill="url(#${id}m)"/>${CRATERS.map(c => `<circle cx="${c[0]}" cy="${c[1]}" r="${c[2]}" fill="#8a5e2a" opacity=".38"/>`).join('')}</g>
        <g id="${id}cres" opacity="0" filter="url(#${id}f)" mask="url(#${id}k)">
          <circle r="52" fill="url(#${id}m)"/>
          ${CRATERS.map(c => `<circle cx="${c[0]}" cy="${c[1]}" r="${c[2]}" fill="#8a5e2a" opacity=".38"/>`).join('')}
        </g>
      </g>
    </g>
    <path id="${id}glass" d="${GLASS}" fill="none" stroke="#4a4a4a" stroke-width="6" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
    <g id="${id}cap" opacity="0">
      <path d="M84 54 L92 36 L108 36 L116 54 Z" fill="#0b0b0b" stroke="#2a2a2a" stroke-width="2" stroke-linejoin="round"/>
      <g stroke="#d8d4c8" stroke-width="3.5" stroke-linecap="round">
        <path d="M76 62H124"/><path d="M76 72H124"/><path d="M76 82H124"/><path d="M78 92H122"/>
      </g>
      <path d="M72 98 H128 L126 106 H74 Z" fill="#0b0b0b" stroke="#2a2a2a" stroke-width="2" stroke-linejoin="round"/>
    </g>
  </svg>${withName ? '<div class="name"><b>night</b><b>light</b></div>' : ''}`;

  if (o.silver) root.querySelectorAll('[fill="#8a5e2a"]').forEach(c => c.setAttribute('fill', '#5d6470'));
  const $ = s => root.querySelector('#' + id + s);
  const el = { glow: $('glow'), fill: $('fill'), moon: $('moon'), full: $('full'), cres: $('cres'), glass: $('glass'), cap: $('cap') };
  const nameEl = root.querySelector('.name');

  const REST = { my: 8, sc: .82, cres: 1, glow: .16, warm: 0 };
  const HOVER = { my: 0, sc: 1, cres: 0, glow: 1, warm: 1 };
  const s = { my: -390, sc: 1, cres: 0, glow: 0, warm: 0, draw: 0, cap: 0 };
  let tid = 0, hovered = false;

  function go(to, dur, ease = E.io) {
    const me = ++tid, from = { ...s }, t0 = performance.now();
    return new Promise(res => {
      (function f(now) {
        if (me !== tid) return res(false);
        const p = Math.min(1, (now - t0) / dur), k = ease(p);
        for (const key in to) s[key] = lerp(from[key], to[key], k);
        if (p < 1) requestAnimationFrame(f); else res(true);
      })(t0);
    });
  }
  const wait = ms => new Promise(r => setTimeout(r, ms));

  function render(now) {
    const breathe = hovered ? 0 : Math.sin(now / 700) * .05 * (s.glow > .05 ? 1 : 0);
    el.glass.setAttribute('stroke-dashoffset', 1 - s.draw);
    el.cap.setAttribute('opacity', s.cap);
    el.moon.setAttribute('transform', `translate(${100 - 7 * s.cres} ${190 + s.my}) scale(${s.sc})`);
    el.full.setAttribute('opacity', 1 - s.cres); el.cres.setAttribute('opacity', s.cres);
    el.moon.style.filter = `drop-shadow(0 0 ${7 * s.cres}px rgba(${P.rim},${.85 * s.cres}))`;
    el.glow.setAttribute('opacity', Math.max(0, s.glow + breathe) * .65);
    el.fill.setAttribute('opacity', s.warm * .2);
    el.glass.setAttribute('stroke', mix(GREY, P.warm, s.warm));
    if (nameEl) nameEl.style.color = mix(TXT, P.warm, s.warm);
    requestAnimationFrame(render);
  }
  requestAnimationFrame(render);

  async function intro() {
    hovered = false;
    Object.assign(s, rise ? (o.full ? { my: 150, sc: 1, cres: 0, glow: 0, warm: 0, draw: 0, cap: 0 } : { my: 150, sc: .82, cres: 1, glow: 0, warm: 0, draw: 0, cap: 0 }) : { my: -390, sc: 1, cres: 0, glow: 0, warm: 0, draw: 0, cap: 0 });
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) { Object.assign(s, REST, { draw: 1, cap: 1 }); return; }
    if (!await go({ draw: 1, cap: 1 }, 1600)) return;
    await wait(250);
    if (rise && !o.full) { await go({ my: 8, glow: .16 }, 4200, E.fall); return; }
    if (!await go({ my: 0, glow: .12 }, 4500, E.fall)) return;      // full moon drops in
    await wait(350);
    await go({ cres: 1, my: 8, sc: .82, glow: .16 }, 2800);                    // wanes into a crescent
  }
  const over = () => { hovered = true;  go(HOVER, 900, E.out); };
  const out  = () => { hovered = false; go(REST, 1100); };
  root.addEventListener('pointerenter', over);
  root.addEventListener('pointerleave', out);
  root.addEventListener('click', () => hovered ? out() : over());   // touch devices
  return { intro };
}

const logos = [makeLogo(document.getElementById('a'), false), makeLogo(document.getElementById('b'), true), makeLogo(document.getElementById('c'), false, true),
  makeLogo(document.getElementById('d'), false, true, { full: true }),
  makeLogo(document.getElementById('e'), false, false, { silver: true }),
  makeLogo(document.getElementById('f'), false, true, { full: true, silver: true })];
const play = () => logos.forEach(l => l.intro());
document.getElementById('replay').addEventListener('click', play);
play();
</script>
</body>
</html>
